<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1b5e20">
  <title>Criar saída - TrilhaBR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="tailwindOutput.css" rel="stylesheet">
</head>
<body class="bg-areia pb-16 text-stone-900 md:pb-0">
  <header class="sticky top-0 z-20 bg-floresta-800 text-white shadow-md">
    <div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-3">
      <a href="index.html" class="text-xl font-extrabold tracking-tight">Trilha<span class="text-brasa-300">BR</span></a>
      <nav class="fixed inset-x-0 bottom-0 flex border-t border-stone-200 bg-white shadow-[0_-2px_8px_rgba(0,0,0,0.08)] md:static md:gap-1 md:border-0 md:bg-transparent md:shadow-none">
        <a href="index.html" class="nav-link">Explorar</a>
        <a href="saidas.html" class="nav-link">Saídas</a>
        <a href="criar.html" class="nav-link" aria-current="page">Criar</a>
        <a href="perfil.html" class="nav-link">Perfil</a>
      </nav>
    </div>
  </header>

  <main class="mx-auto max-w-2xl p-4">
    <h1 class="text-3xl font-extrabold">Criar saída</h1>
    <p class="text-stone-600">Convide a galera para o seu próximo rolê.</p>

    <form class="card mt-5 grid gap-5 p-5 md:p-7" action="#" method="post">
      <div class="campo">
        <label for="titulo">Nome da saída</label>
        <input id="titulo" type="text" placeholder="Ex.: Cachoeira Escondida, sábado cedo">
      </div>

      <div class="grid gap-5 sm:grid-cols-2">
        <div class="campo">
          <label for="tipo">Tipo</label>
          <select id="tipo"><option>Trilha</option><option>Corrida</option></select>
        </div>
        <div class="campo">
          <label for="dif">Dificuldade</label>
          <select id="dif"><option>Fácil</option><option>Moderada</option><option>Difícil</option></select>
        </div>
      </div>

      <div class="grid gap-5 sm:grid-cols-2">
        <div class="campo"><label for="data">Data</label><input id="data" type="date"></div>
        <div class="campo"><label for="hora">Horário</label><input id="hora" type="time"></div>
      </div>

      <div class="grid gap-5 sm:grid-cols-3">
        <div class="campo sm:col-span-2">
          <label for="local">Ponto de encontro</label>
          <input id="local" type="text" placeholder="Endereço ou referência">
        </div>
        <div class="campo"><label for="vagas">Vagas</label><input id="vagas" type="number" min="1" value="8"></div>
      </div>

      <div class="campo">
        <label for="desc">Descrição</label>
        <textarea id="desc" rows="4" placeholder="Nível do grupo, o que levar, ritmo..."></textarea>
      </div>

      <button type="submit" class="btn btn-verde">Publicar saída</button>
    </form>
  </main>
</body>
</html>
